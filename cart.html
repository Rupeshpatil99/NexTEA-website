<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTEA Cart</title>
<link rel="stylesheet" href="rp.css">
</head>
<body>

<div style="text-align: center; margin-top: 20px;">
  <a href="index.html" style="color: #2c2c2c; text-decoration: none;">← Back to Home</a>
</div>

<h2 style="text-align:center;">Your Cart</h2>

<div style="text-align: center; margin: 20px 0;">
  <button id="export-orders-btn" style="padding: 10px 20px; background: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 0 10px;">Export All Orders to Excel</button>
</div>

<table class="cart-table">
<thead>
<tr>
<th>Tea</th>
<th>Qty</th>
<th>Price</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td colspan="4" style="text-align: center; padding: 40px;">Loading cart...</td>
</tr>
</tbody>
</table>

<button class="checkout-btn">Checkout</button>

<script src="script.js"></script>
</body>
</html>
